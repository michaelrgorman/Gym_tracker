<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Iron Log</title>
<meta name="description" content="Powerlifting-focused workout tracker">
<meta name="theme-color" content="#15161A">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <h1 id="header-title">Home</h1>
  <div class="subline" id="header-subline">Iron Log</div>
</header>

<!-- ============ HOME ============ -->
<section class="view active" id="view-home" data-title="Home" data-subline="Iron Log">
  <button class="btn-primary" id="home-start-workout-btn">Start workout</button>

  <div class="card" style="margin-top: 16px;">
    <div class="section-label">Connection</div>
    <span class="status-pill" id="connection-status">
      <span class="status-dot" id="connection-dot"></span>
      <span id="connection-text">Checking…</span>
    </span>
  </div>

  <div id="home-root"></div>
</section>

<!-- ============ LOG ============ -->
<section class="view" id="view-log" data-title="Log" data-subline="Start or continue a workout">
  <div id="log-root"></div>
</section>

<!-- Rest timer banner (hidden unless active) -->
<div class="rest-timer-banner" id="rest-timer-banner" hidden>
  <span class="rest-timer-label">Rest</span>
  <span class="rest-timer-clock" id="rest-timer-clock">2:00</span>
  <button class="rest-timer-btn" id="rest-timer-add30">+30s</button>
  <button class="rest-timer-btn" id="rest-timer-skip">Skip</button>
</div>

<!-- ============ HISTORY ============ -->
<section class="view" id="view-history" data-title="History" data-subline="Past sessions">
  <div id="history-root"></div>
</section>

<!-- ============ PROGRESS ============ -->
<section class="view" id="view-progress" data-title="Progress" data-subline="e1RM and bodyweight trends">
  <div id="progress-root"></div>
</section>

<!-- ============ BEST LIFTS ============ -->
<section class="view" id="view-best" data-title="Best Lifts" data-subline="All-time PRs">
  <div id="best-root"></div>
</section>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-target="view-home">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Home
  </button>
  <button class="nav-btn" data-target="view-log">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
    Log
  </button>
  <button class="nav-btn" data-target="view-history">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    History
  </button>
  <button class="nav-btn" data-target="view-progress">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
    Progress
  </button>
  <button class="nav-btn" data-target="view-best">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
    Best
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="log.js"></script>
<script src="views.js"></script>
<script src="templates.js"></script>
<script src="catalog.js"></script>
<script src="program.js"></script>
</body>
</html>
